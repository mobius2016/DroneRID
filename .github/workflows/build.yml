name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: scripts/setup.sh
      - run: scripts/test.sh
      - run: scripts/build-flipper.sh
      - run: scripts/build-companion.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DroneRID-development-builds
          path: |
            flipper/dist/drone_rid.fap
            companion/.pio/build/devboard/firmware.bin
            companion/.pio/build/devboard/bootloader.bin
            companion/.pio/build/devboard/partitions.bin
